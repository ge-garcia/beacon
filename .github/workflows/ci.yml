name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4
      - name: Build library (with network)
        run: alr -n build
      - name: Build library (BEACON_NETWORK=no, the embedded profile)
        run: BEACON_NETWORK=no alr -n build
      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/queue_tests
          ./bin/topic_tests
          ./bin/wire_tests
          timeout 10s ./bin/transport_tests
          timeout 10s ./bin/bridge_tests
      - name: In-process demo (reliable never drops, best-effort keeps newest)
        run: |
          cd demo
          alr -n build
          ./bin/inproc_demo
      - name: UDP demo, two processes on loopback
        run: |
          cd demo
          ./bin/net_subscriber 239.255.0.1 5000 3 > sub.log &
          sleep 0.5
          ./bin/net_publisher 239.255.0.1 5000 200
          wait
          cat sub.log
          grep -q "done, 200 readings" sub.log
      - name: SPARK flow analysis
        run: |
          alr -n with gnatprove
          alr -n exec -- gnatprove -P beacon.gpr --mode=flow --checks-as-errors=on
