name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4
        with:
          version: 2.1.1
          toolchain: gnat_native=16.1.0 gprbuild=26.0.1
      - name: Build library (with network)
        run: alr -n build
      - name: Build library (BEACON_NETWORK=no, without src/net)
        run: BEACON_NETWORK=no alr -n build
      - name: Check src/ under the Jorvik profile
        run: |
          printf 'pragma Profile (Jorvik);\n' > "$RUNNER_TEMP/jorvik.adc"
          alr -n exec -- gcc -c -gnat2022 -gnatc -gnatec="$RUNNER_TEMP/jorvik.adc" -Isrc src/*.ads src/*.adb
      - name: Build for the Raspberry Pi Pico (RP2040)
        run: |
          cd board
          alr -n build
      - name: Keep the board ELF
        uses: actions/upload-artifact@v4
        with:
          name: board-elf
          path: board/bin/board_blink
      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/queue_tests
          ./bin/topic_tests
          ./bin/wire_tests
          timeout 10s ./bin/transport_tests
          timeout 10s ./bin/bridge_tests
      - name: In-process demo (reliable never drops, best-effort keeps newest)
        run: |
          cd demo
          alr -n build
          ./bin/inproc_demo
      - name: UDP demo, two processes on loopback
        run: |
          cd demo
          ./bin/net_subscriber 239.255.0.1 5000 3 > sub.log &
          sleep 0.5
          ./bin/net_publisher 239.255.0.1 5000 200
          wait
          cat sub.log
          grep -q "done, 200 readings" sub.log
      - name: SPARK flow analysis
        working-directory: prove
        run: alr -n exec -- gnatprove -P ../beacon.gpr --mode=flow --checks-as-errors=on
      - name: SPARK proof of Beacon.Queue
        working-directory: prove
        run: alr -n exec -- gnatprove -P beacon_prove.gpr --mode=all --checks-as-errors=on
      - name: Keep the proof output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnatprove-out
          path: prove/obj/gnatprove/gnatprove.out
